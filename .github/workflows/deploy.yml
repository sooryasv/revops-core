# Deploy to Azure Container Apps through OIDC (03 section 13). WROTE-NOT-RUN: needs an Azure subscription, GHCR and secrets
# that only the human has. Follow infra/azure/README.md for the one-time setup; this workflow only automates releases.
name: deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # OIDC token for azure/login: no long-lived cloud credentials are stored in GitHub

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - id: ref
        run: echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # configure required reviewers on this environment
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      APP_URL: ${{ vars.APP_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run migrations with the OWNER role (before the new revision takes traffic)
        run: |
          pip install --quiet uv
          cd backend
          uv sync --frozen --no-dev
          MIGRATION_DATABASE_URL='${{ secrets.MIGRATION_DATABASE_URL }}' uv run alembic upgrade head

      - name: Update the container app to the new image
        run: |
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_CONTAINER_APP" \
            --image "${{ needs.build-and-push.outputs.image }}"

      - name: Smoke test /readyz (database reachable, migrations at head)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/readyz"; then exit 0; fi
            sleep 5
          done
          echo "readyz did not become healthy" >&2; exit 1

      - name: Smoke test a seeded login (only when a smoke account is configured)
        if: env.SMOKE_EMAIL != ''
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$APP_URL/api/v1/auth/login" \
            -H 'content-type: application/json' -H "origin: $APP_URL" \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}")
          [ "$code" = "200" ] || { echo "login smoke test returned $code" >&2; exit 1; }
